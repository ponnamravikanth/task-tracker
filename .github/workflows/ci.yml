name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: task_tracker_app
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: task_tracker_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Download source code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7

        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Run PostgreSQL integration tests
        run: npm run test:postgres

        env:
          TEST_DATABASE_URL: postgresql://task_tracker_app:ci_test_password@127.0.0.1:5432/task_tracker_test

      - name: Check server syntax
        run: npm run check:server

      - name: Build production application
        run: npm run build